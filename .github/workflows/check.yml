name: Game checks
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and game rules
        run: npm run check
